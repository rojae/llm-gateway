services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: ${GW_ANALYTICS_DB_PASSWORD:?Run scripts/admin.sh or set GW_ANALYTICS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${GW_ANALYTICS_DB_PORT:-54329}:5432"
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway -d llm_gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  analytics-data:
