apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-admin
  labels:
    app.kubernetes.io/name: llm-gateway-admin
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway-admin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: registry.example.com/llm-gateway-admin:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_API_URL
              value: http://llm-gateway.llm-gateway.svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /admin
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /admin
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /admin
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway-admin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway-admin
