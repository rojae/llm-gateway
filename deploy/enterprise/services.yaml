apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-headless
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: admin-api
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-admin
  labels:
    app.kubernetes.io/name: llm-gateway-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway-admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-management
  labels:
    app.kubernetes.io/name: llm-gateway-management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: management
      port: 9090
      targetPort: management
