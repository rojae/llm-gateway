server:
  address: ${GW_BIND_ADDRESS:127.0.0.1}
  port: ${GW_PORT:8080}

# Claude Code sends full conversation/tool context on each turn.
spring:
  config:
    # Spring Boot does not load .env files by itself. Support root and module working directories.
    # The generated admin.env holds local secrets; .env.local holds editable local settings.
    import:
      - optional:file:./var/admin.env[.properties]
      - optional:file:../var/admin.env[.properties]
      - optional:file:./llm-gateway-api/.env.local[.properties]
      - optional:file:./.env.local[.properties]
  codec:
    max-in-memory-size: ${GW_MAX_BODY_SIZE:32MB}
  flyway:
    # Analytics migrates in its own bounded worker, not on the proxy startup path.
    enabled: false

gateway:
  # Legacy /v1/** routes retain their single configurable upstream.
  upstream-base-url: ${GW_UPSTREAM_BASE_URL:https://api.openai.com/v1}
  # 비워두면 passthrough 모드: 호출자의 Authorization 을 그대로 전달한다.
  upstream-api-key: ${GW_UPSTREAM_API_KEY:}
  connect-timeout: ${GW_CONNECT_TIMEOUT:5s}
  # 청크와 청크 사이 최대 간격. 전체 응답 시간 제한이 아니다.
  read-timeout: ${GW_READ_TIMEOUT:120s}
  # 비워두면 매 기동마다 keyId가 바뀐다. 안정적인 키별 집계에는 고정 비밀값을 설정한다.
  key-id-secret: ${GW_KEY_ID_SECRET:}
  inject-stream-usage: ${GW_INJECT_STREAM_USAGE:true}
  environment: ${GW_ENVIRONMENT:local}
  traffic-label: ${GW_TRAFFIC_LABEL:live}
  security:
    mode: ${GW_SECURITY_MODE:local}
    admin-ui-url: ${GW_ADMIN_UI_URL:/admin/}
    issuer-uri: ${GW_OIDC_ISSUER_URI:}
    audience: ${GW_OIDC_AUDIENCE:}
    client-id: ${GW_OIDC_CLIENT_ID:}
    client-secret: ${GW_OIDC_CLIENT_SECRET:}
    tenant-claim: ${GW_OIDC_TENANT_CLAIM:tenant_id}
    roles-claim: ${GW_OIDC_ROLES_CLAIM:roles}
    allowed-tenants: ${GW_ALLOWED_TENANTS:}
    external-base-url: ${GW_EXTERNAL_BASE_URL:}
  content-log:
    max-chars: ${GW_CONTENT_LOG_MAX_CHARS:4096}
    max-event-bytes: ${GW_CONTENT_LOG_MAX_EVENT_BYTES:1048576}
    format: ${GW_CONTENT_LOG_FORMAT:pretty}
  analytics:
    enabled: ${GW_ANALYTICS_ENABLED:false}
    jdbc-url: ${GW_ANALYTICS_JDBC_URL:jdbc:postgresql://127.0.0.1:54329/llm_gateway}
    username: ${GW_ANALYTICS_DB_USER:llm_gateway}
    password: ${GW_ANALYTICS_DB_PASSWORD:}
    admin-token: ${GW_ADMIN_TOKEN:}
    source-id: ${GW_ANALYTICS_SOURCE_ID:local}
    tenant-id: ${GW_ANALYTICS_TENANT_ID:local}
    max-pool-size: ${GW_ANALYTICS_MAX_POOL_SIZE:8}
    connection-timeout: ${GW_ANALYTICS_CONNECTION_TIMEOUT:3s}
    request-retention-days: ${GW_ANALYTICS_REQUEST_RETENTION_DAYS:0}
    content-retention-days: ${GW_ANALYTICS_CONTENT_RETENTION_DAYS:0}
    legacy-tenant-id: ${GW_ANALYTICS_LEGACY_TENANT_ID:}
    access-log: ${GW_ANALYTICS_ACCESS_LOG:${GW_ACCESS_LOG_FILE:var/access.log}}
    content-log: ${GW_ANALYTICS_CONTENT_LOG:${GW_CONTENT_LOG_FILE:var/content.log}}
    poll-interval: ${GW_ANALYTICS_POLL_INTERVAL:2s}
    batch-size: ${GW_ANALYTICS_BATCH_SIZE:250}
    max-line-bytes: ${GW_ANALYTICS_MAX_LINE_BYTES:1048576}
  telemetry:
    enabled: ${GW_TELEMETRY_ENABLED:false}
    token: ${GW_TELEMETRY_TOKEN:}
    billing-mode: ${GW_TELEMETRY_BILLING_MODE:subscription_declared}
    max-body-bytes: ${GW_TELEMETRY_MAX_BODY_BYTES:2097152}
    max-records: ${GW_TELEMETRY_MAX_RECORDS:1000}
  # Explicit provider paths always use the individual caller's API key.
  providers:
    openai-base-url: ${GW_OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic-base-url: ${GW_ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}

logging:
  level:
    root: INFO
    gateway.access: INFO
    gateway.content: ${GW_CONTENT_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    # /v1/** 은 프록시가 쓰는 경로이므로 문서 엔드포인트는 그 바깥에 둔다.
    path: /openapi.json
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

# Run management on an internal interface/port; never route it through the public ingress.
management:
  server:
    address: ${GW_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${GW_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        dependencies:
          include: analytics
  health:
    redis:
      enabled: false
